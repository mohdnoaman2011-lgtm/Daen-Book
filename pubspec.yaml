name: daen_book
description: دفتر الديون — تطبيق لإدارة ديون الدائنين والمشتريات والدفعات
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  google_fonts: ^6.2.1
  shared_preferences: ^2.2.3
  pdf: ^3.11.0
  printing: ^5.13.0
  share_plus: ^10.0.0
  path_provider: ^2.1.3
  file_picker: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# تثبيت نسخة مكتبة الحفظ: النسخة 2.5.0 (صدرت 17 أكتوبر 2026) تُسقط التطبيق عند التشغيل.
dependency_overrides:
  shared_preferences_android: 2.4.28

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
