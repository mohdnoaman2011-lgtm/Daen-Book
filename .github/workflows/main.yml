name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android platform
        run: flutter create --platforms=android --project-name daen_book --org com.example .

      - name: Add INTERNET permission
        run: |
          sed -i 's|<manifest xmlns:android="http://schemas.android.com/apk/res/android">|&\n    <uses-permission android:name="android.permission.INTERNET"/>|' android/app/src/main/AndroidManifest.xml

      - name: Force compileSdk 36
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/compile-sdk.gradle <<'EOF'
          allprojects {
            afterEvaluate { p ->
              if (p.hasProperty('android')) {
                p.android.compileSdkVersion 36
              }
            }
          }
          EOF

      - name: Get packages
        run: flutter pub get

      - name: Add custom launcher icon
        run: |
          flutter pub add --dev flutter_launcher_icons
          dart run flutter_launcher_icons

      - name: Set app label
        run: |
          sed -i 's|android:label="[^"]*"|android:label="دفتر الديون"|' android/app/src/main/AndroidManifest.xml

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: daen-book-apk
          path: build/app/outputs/flutter build apk --release --no-shrink